[project]
name = "echo-assistant"
version = "0.1.0"
description = "Echo: RAG assistant that classifies customer reviews and drafts replies with sources"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
